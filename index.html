<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illicit Speed XS - Leaderboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header style="display: none" class="header-bar">
        <!-- <h1 class="tournament-title">Tablero de Puntaje Illicit Speed XS</h1> -->
        <div class="player-counter" id="player-counter">Corredores: 0 / 12</div>
        <img
          src="assets/backgrounds/Logo Illicit Speed.webp"
          alt="Game Logo"
          class="decor-logo"
          onerror="this.style.display = 'none'"
        />
      </header>

      <main class="board-grid">
        <!-- Column 1: Positions 1-6 -->
        <div class="race-column" id="col-1"></div>

        <!-- Column 2: Positions 7-12 -->
        <div class="race-column" id="col-2"></div>

        <!-- Column 3: Racer Pool & Sidebar -->
        <aside class="sidebar" id="sidebar-pool-zone">
          <h2 class="sidebar-title">Corredores</h2>
          <div class="pool-grid" id="pool-grid"></div>
          <div class="sidebar-controls">
            <button class="music-btn" id="music-toggle-btn">
              <span id="music-icon">🔊</span>
              <span id="music-label">Música Ambiente: OFF</span>
            </button>
          </div>
        </aside>
      </main>

      <!-- Decorative Assets -->
      <div class="board-decorations">
        <img
          src="assets/backgrounds/background-curve.webp"
          alt=""
          class="decor-curve"
          onerror="this.style.display = 'none'"
        />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
